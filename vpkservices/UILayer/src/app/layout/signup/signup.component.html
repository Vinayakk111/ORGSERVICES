<div class="container mt-5">
    <h2>Sign Up</h2>
    <form [formGroup]="signupForm">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" formControlName="name">
            <div *ngIf="isInvalid('name')" class="text-danger">
                <small *ngIf="signupForm.controls.name.errors?.required">Name is required.</small>
                <small *ngIf="signupForm.controls.name.errors?.minlength">At least 3 characters.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="email">
            <div *ngIf="isInvalid('email')" class="text-danger">
                <small *ngIf="signupForm.controls.email.errors?.required">Email is required.</small>
                <small *ngIf="signupForm.controls.email.errors?.email">Invalid email format.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password">
            <div *ngIf="isInvalid('password')" class="text-danger">
                <small *ngIf="signupForm.controls.password.errors?.required">Password is required.</small>
                <small *ngIf="signupForm.controls.password.errors?.minlength">At least 6 characters.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" formControlName="confirmPassword">
            <div *ngIf="signupForm.hasError('mismatch')" class="text-danger">
                <small>Passwords do not match.</small>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" formControlName="phone">
            <div *ngIf="isInvalid('phone')" class="text-danger">
                <small *ngIf="signupForm.controls.phone.errors?.required">Phone number is required.</small>
                <small *ngIf="signupForm.controls.phone.errors?.pattern">Must be 10 digits.</small>
            </div>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" formControlName="acceptTerms">
            <label class="form-check-label">I accept the Terms & Conditions</label>
            <div *ngIf="isInvalid('acceptTerms')" class="text-danger">
                <small>You must accept the terms.</small>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="signupForm.invalid" (click)="onSubmit()">Sign
            Up</button>
    </form>
</div>

<div>
    <br />
</div>
<div>
    <br />
</div>
