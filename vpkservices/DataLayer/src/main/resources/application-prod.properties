
spring.datasource.url = jdbc:mysql://localhost:3306/world?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.download.path=/data

logging.file.name=E:/data/prod/app.log
logging.file.path=E:/data/prod/
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log Rotation Settings
logging.logback.rollingpolicy.file-name-pattern=E:/data/prod/app-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=10MB
