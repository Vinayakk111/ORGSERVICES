management.endpoints.web.exposure.include=*
management.httpexchanges.enabled=true

spring.datasource.url = jdbc:mysql://localhost:3306/world?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate


app.download.path=E:/data/dev

logging.level.root=INFO
logging.level.com.app.vpk=DEBUG
logging.level.org.springframework=ERROR

# Log File Settings
logging.file.name=E:/data/dev/app.log
logging.file.path=E:/data/dev/
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId}] %-5level [%thread] %logger{36} - %msg%n
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n



# Log Rotation Settings
logging.logback.rollingpolicy.file-name-pattern=E:/data/dev/app-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.total-size-cap=50MB


