# Enable all Actuator endpoints
management.endpoints.web.exposure.include=*
management.httpexchanges.enabled=true

spring.datasource.url = jdbc:mysql://localhost:3306/world?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = root
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.download.path=/app/default/
spring.profiles.active=dev
server.servlet.context-path=/apilayer

spring.cache.cache-names=configCache
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
